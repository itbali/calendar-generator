<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Календарей</title>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Создайте и экспортируйте красивые календари с праздниками">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Календарь">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg">

  <!-- Prevent theme flash on load -->
  <script>
    (function() {
      try {
        const settings = JSON.parse(localStorage.getItem('calendar-settings'));
        const prefersDark = settings?.darkMode !== undefined
          ? settings.darkMode
          : window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (prefersDark) {
          document.body.classList.add('dark-mode');
        }
      } catch (e) {
        // Ignore errors
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
